    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="apple-mobile-web-app-title" content="GKTW" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta name="description" content="GKTW mission-trip volunteer shift schedule" />
    <title>GKTW Trip Schedule</title>
