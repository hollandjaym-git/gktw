<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Standalone GKTW PWA identity. Baked into the shell (no JS swap) so
         "Add to Home Screen" picks up the right name/icon/start_url. -->
    <meta name="theme-color" content="#11291B" />
    <link rel="manifest" href="/manifest.json" />

    <!-- GKTW brand icon: yellow sunburst on dark green (matches the landing tile).
         ?v bumped to bust the previously-cached icon at these stable paths. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png?v=3" sizes="32x32" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GKTW" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />

    <meta name="description" content="GKTW mission-trip volunteer shift schedule" />
    <title>GKTW Trip Schedule</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
