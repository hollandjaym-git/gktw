server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx has no default MIME mapping for the PWA manifest; set it explicitly.
  location = /manifest.json {
    add_header Cache-Control "no-store, must-revalidate";
    default_type application/manifest+json;
  }

  # Hashed build assets are content-addressed (index-<hash>.js) — cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Version marker + HTML shell must never be cached, or an installed PWA keeps
  # loading a stale bundle. no-store also keeps Cloudflare from caching them, so
  # a new deploy is picked up immediately (drives the update banner).
  location = /version.json {
    add_header Cache-Control "no-store, must-revalidate";
    default_type application/json;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Proxy API calls to the backend. In the alpinepost.app ecosystem the request
  # flows front-caddy -> this nginx -> backend. Harmless standalone.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout    300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
