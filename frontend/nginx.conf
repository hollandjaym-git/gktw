# Real client IP behind Cloudflare -> front-caddy -> this nginx -> backend.
# front-caddy replaces X-Forwarded-For with the address it actually saw on the socket, so when that address is a
# Cloudflare edge, the end user's address is in CF-Connecting-IP (which only Cloudflare can be trusted to set);
# otherwise (someone hitting the origin directly, or local dev) the forwarded address already IS the client and a
# spoofed CF-Connecting-IP is ignored. The backend (trust proxy 1) then reads $real_client_ip as the last XFF entry,
# so its login rate limiter, lockout notices and login_audit see the real client instead of a Cloudflare node.
# Ranges: https://www.cloudflare.com/ips (if one is missing we just fall back to the old behavior).
geo $http_x_forwarded_for $xff_is_cloudflare {
  default 0;
  173.245.48.0/20 1;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  141.101.64.0/18 1;
  108.162.192.0/18 1;
  190.93.240.0/20 1;
  188.114.96.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
  162.158.0.0/15 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  172.64.0.0/13 1;
  131.0.72.0/22 1;
  2400:cb00::/32 1;
  2606:4700::/32 1;
  2803:f800::/32 1;
  2405:b500::/32 1;
  2405:8100::/32 1;
  2a06:98c0::/29 1;
  2c0f:f248::/32 1;
}
map "$xff_is_cloudflare:$http_cf_connecting_ip" $real_client_ip {
  "~^1:(?<cfip>[0-9a-fA-F:.]+)$" $cfip;
  default $http_x_forwarded_for;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx has no default MIME mapping for the PWA manifest; set it explicitly.
  location = /manifest.json {
    add_header Cache-Control "no-store, must-revalidate";
    default_type application/manifest+json;
  }

  # Hashed build assets are content-addressed (index-<hash>.js) — cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Version marker + HTML shell must never be cached, or an installed PWA keeps
  # loading a stale bundle. no-store also keeps Cloudflare from caching them, so
  # a new deploy is picked up immediately (drives the update banner).
  location = /version.json {
    add_header Cache-Control "no-store, must-revalidate";
    default_type application/json;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Proxy API calls to the backend. In the alpinepost.app ecosystem the request
  # flows front-caddy -> this nginx -> backend. Harmless standalone.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $real_client_ip;
    proxy_read_timeout    300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
